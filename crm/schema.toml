# Схема CRM «Контент завод» — единственный источник правды о листах, столбцах, списках и правилах.
# Читает crm.py. Меняет только Роберт через запрос на слияние (тип коммита «crm»).
# Новые столбцы — только в конец листа. Переименование столбца = миграция данных.
version = 3

[google]
auth = "service_account"   # "service_account" — робот-аккаунт (план А); "oauth" — пользователь-агент (план Б)
drive_id = ""              # ID общего диска «Контент завод»; setup находит и вписывает сам
spreadsheet_id = ""        # ID таблицы «CRM Контент завод»; setup создаёт и вписывает сам
key_file = "~/.config/kontent-zavod/agent-key.json"
oauth_client_file = "~/.config/kontent-zavod/oauth-client.json"
oauth_token_file = "~/.config/kontent-zavod/agent-token.json"

# Куда ведут рекламные ссылки. Ник — без @. Пусто — скрипт подскажет собрать ссылку вручную.
[links]
tg_account = ""            # Telegram руководителя проекта: ссылка t.me/<ник>?text=… с кодом размещения в тексте
tg_bot = ""                # бот заказов (когда появится): ссылка t.me/<бот>?start=<код размещения>
site = ""                  # сайт (когда появится): ссылка ?utm_content=<код размещения>

# Правила плана v18 (раздел 3.3, 3.4, 7.1, 7.5) — числа меняются здесь, а не в коде
[rules]
postpay_limit = 10                  # первые 10 внешних заказов — постоплата (MVP); заказы УК и Kwork мест не занимают
prepay_percent = 50                 # «50 на 50»: до начала работы — 50% от всего заказа (всех его товаров)
first_discount_percent = 10         # скидка на первый заказ за подписку на «Проще» и кейс
free_revision_rounds = 2            # бесплатные круги правок
revision_product = "Доп. круг правок"   # продукт «Прайса» за платный круг; скидка на него не действует
internal_source = "УК"              # внутренний заказчик: не входит в цель и в счёт 10 заказов MVP
partner_percent = 15                # выплата партнёру с денег, пришедших от его клиентов
kwork_fee_percent = 20              # комиссия Kwork с исполнителя (план 7.5): в отчёте вычитается из денег «на счёт»
ai_expense = "нейросети"            # статья «Расходов» для стоимости единицы (план 3.4: нейросети за месяц / готовые работы)
goal_month_rub = 1000000            # цель: выручка в месяц (январь 2027)
work_statuses = ["в работе", "на проверке", "на согласовании", "правки", "согласовано", "выполнен"]

[folders]
root = ["Заказы", "Клиенты", "Обучение", "Пробные обложки", "Записи процессов", "Документы", "_проверка агента"]
order = ["ТЗ", "Исходники", "Работа", "На согласование", "Результат"]

[lists]
contact = ["Telegram", "MAX", "Kwork", "телефон", "email", "другое"]
channel = ["Telegram личный", "Telegram-бот", "MAX личный", "MAX-бот", "Kwork", "сайт", "другое"]
source = ["партнёр", "пробная обложка", "реклама Telegram", "Яндекс Директ", "Kwork", "канал Проще", "сайт", "рекомендация", "УК", "другое"]
platform = ["WB", "Ozon", "WB и Ozon", "Яндекс Маркет", "другая"]
discount = ["нет", "первый заказ 10%", "другая"]
pay_order = ["постоплата", "50 на 50", "через Kwork"]
pay_status = ["не выставлен", "ждём предоплату", "предоплата получена", "ждём оплату", "оплачен", "возврат"]
pay_kind = ["оплата", "возврат"]
pay_method = ["Продамус", "перевод на счёт ИП", "Kwork", "другое"]
status = ["новая заявка", "обсуждение", "ждём материалы", "в работе", "на проверке", "на согласовании", "правки", "согласовано", "выполнен", "отменён"]
case = ["не спрашивали", "разрешил", "отказал"]
partner_type = ["карго", "фулфилмент", "другое"]
partner_status = ["найден", "написали", "демо отправлено", "договорились", "отказ", "пауза"]
cover_status = ["сделана", "отправлена", "ответил", "заказ", "отказ", "нет ответа"]
ad_platform = ["Telegram-канал", "Яндекс Директ", "биржа", "другое"]
expense_kind = ["нейросети", "другие сервисы", "прочее"]

# Куда можно перевести «Статус» заказа. Иное — только с --force и причиной.
[transitions]
"новая заявка" = ["обсуждение", "ждём материалы", "в работе", "отменён"]
"обсуждение" = ["ждём материалы", "в работе", "отменён"]
"ждём материалы" = ["в работе", "отменён"]
"в работе" = ["на проверке", "отменён"]
"на проверке" = ["в работе", "на согласовании"]
"на согласовании" = ["правки", "согласовано", "отменён"]
"правки" = ["в работе", "на проверке"]
"согласовано" = ["выполнен", "правки"]
"выполнен" = []
"отменён" = ["обсуждение"]

# Типы: id, text, url, date (дд.мм.гггг), money (целые рубли), int, bool, list:<список>, ref:<лист>,
# products (через запятую из «Прайса»), source_code (промокод партнёра или код размещения), promo.
# computed = true — столбец считает скрипт, командой set его не задать.
# id_prefix — буква номера; id_aliases — похожие буквы, которые скрипт принимает и приводит к id_prefix.
[[sheets]]
name = "Клиенты"
key = "ID клиента"
id_prefix = "К"
id_aliases = ["K"]
columns = [
  { name = "ID клиента", type = "id", note = "К-0001, К-0002… Присваивает агент. Не менять." },
  { name = "Имя", type = "text", required = true, note = "Как обращаться к клиенту." },
  { name = "Канал связи", type = "list:contact", required = true, note = "Где ведём переписку." },
  { name = "Контакт", type = "text", required = true, note = "@username, телефон или логин Kwork." },
  { name = "ID чата", type = "text", note = "Номер чата Telegram или MAX, если известен. Нужен ботам и агенту." },
  { name = "Источник", type = "list:source", required = true, note = "Откуда пришёл клиент впервые. УК — внутренний заказчик, в цель 1 млн не входит." },
  { name = "Код источника", type = "source_code", note = "Промокод партнёра (лист «Партнёры») или код размещения R-0005 (лист «Реклама»). Только существующие." },
  { name = "Дата первого обращения", type = "date", default = "today", note = "дд.мм.гггг" },
  { name = "Папка", type = "url", note = "Папка клиента на Диске (переписка, бренд). Создаёт агент." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Заказы"
key = "Номер"
columns = [
  { name = "Номер", type = "id", note = "0012-1: номер заказа и номер товара в нём. Присваивает агент. Не менять." },
  { name = "ID клиента", type = "ref:Клиенты", required = true, note = "Выбрать из списка." },
  { name = "Дата", type = "date", default = "today", note = "Дата заявки, дд.мм.гггг." },
  { name = "Канал", type = "list:channel", required = true, note = "Где пришёл этот заказ." },
  { name = "Товар", type = "text", required = true, note = "Коротко: что за товар, бренд, модель." },
  { name = "Площадка", type = "list:platform", note = "Для какой площадки контент." },
  { name = "Ссылка на карточку", type = "url", note = "Карточка товара клиента, если есть." },
  { name = "Состав", type = "products", note = "Продукты из листа «Прайс» через запятую. Обязателен для «в работе»." },
  { name = "Цена по прайсу, ₽", type = "money", computed = true, note = "Сумма «Состава» по «Прайсу». Считает скрипт при каждой смене состава. Руками не менять." },
  { name = "Скидка", type = "list:discount", default = "нет", note = "«другая» — только с согласия Кристины, причина в «Комментарии»." },
  { name = "К оплате, ₽", type = "money", note = "Сколько платит клиент за этот товар. Считает скрипт по скидке; ниже правил — только «другая»." },
  { name = "Порядок оплаты", type = "list:pay_order", note = "Первые 10 заказов — постоплата, далее 50 на 50; Kwork — через Kwork." },
  { name = "Статус оплаты", type = "list:pay_status", default = "не выставлен", note = "«предоплата получена» и «оплачен» ставит скрипт по листу «Оплаты»." },
  { name = "Оплачено, ₽", type = "money", default = "0", computed = true, note = "Сумма по листу «Оплаты». Считает скрипт (команда pay). Руками не менять." },
  { name = "Статус", type = "list:status", default = "новая заявка", note = "Этап работы. Выбрать из списка." },
  { name = "Дедлайн", type = "date", note = "Когда отдаём клиенту, дд.мм.гггг." },
  { name = "Сдан", type = "date", note = "Дата сдачи. Ставит скрипт при «выполнен»." },
  { name = "Круги правок", type = "int", default = "0", note = "Два бесплатно, каждый следующий — 1 000 ₽. Агент прибавляет сам." },
  { name = "Кейс", type = "list:case", default = "не спрашивали", note = "Разрешил ли клиент показать работу (скидка 10% и портфолио)." },
  { name = "Папка", type = "url", note = "Папка заказа на Диске. Создаёт агент." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Оплаты"
columns = [
  { name = "Дата", type = "date", required = true, default = "today", note = "Когда пришли деньги, дд.мм.гггг. Пишет агент командой pay." },
  { name = "Номер заказа", type = "ref:Заказы", required = true, note = "0012-1. Один платёж за несколько товаров скрипт делит сам." },
  { name = "Сумма, ₽", type = "money", required = true, note = "Сколько пришло (возврат — тоже положительным числом)." },
  { name = "Вид", type = "list:pay_kind", default = "оплата", note = "оплата или возврат." },
  { name = "Способ", type = "list:pay_method", required = true, note = "Куда пришли деньги: сверка с выпиской и Kwork." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Прайс"
key = "Продукт"
columns = [
  { name = "Продукт", type = "text", required = true, note = "Название без запятых. Его пишут в «Состав» заказа." },
  { name = "Цена, ₽", type = "money", required = true, note = "Цены заканчиваются на 99." },
  { name = "В продаже", type = "bool", note = "Галочка — можно продавать." },
  { name = "Состав пакета", type = "products", note = "Только для пакетов: что входит." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Партнёры"
key = "ID партнёра"
id_prefix = "П"
unique = ["Промокод"]
columns = [
  { name = "ID партнёра", type = "id", note = "П-0001… Присваивает агент." },
  { name = "Название", type = "text", required = true, note = "Карго или фулфилмент." },
  { name = "Тип", type = "list:partner_type", required = true, note = "Выбрать из списка." },
  { name = "Контакт", type = "text", required = true, note = "Telegram, телефон или сайт." },
  { name = "Промокод", type = "promo", note = "Личный код партнёра (слово, не похожее на R-0005). Его клиенты пишут в «Код источника»." },
  { name = "Статус", type = "list:partner_status", default = "найден", note = "Выбрать из списка." },
  { name = "Дата контакта", type = "date", default = "today", note = "Последний контакт, дд.мм.гггг." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Выплаты"
columns = [
  { name = "Дата", type = "date", required = true, default = "today", note = "Когда выплатили, дд.мм.гггг." },
  { name = "ID партнёра", type = "ref:Партнёры", required = true, note = "Кому выплатили." },
  { name = "За месяц", type = "text", required = true, pattern = "^(0[1-9]|1[0-2])\\.20[0-9]{2}$", note = "мм.гггг — за какой месяц (сумма — из report --month)." },
  { name = "Сумма, ₽", type = "money", required = true, note = "Сколько выплатили." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Пробные обложки"
key = "Артикул WB"
columns = [
  { name = "Артикул WB", type = "text", required = true, pattern = "^[0-9]{5,12}$", note = "Только цифры, 5–12 знаков: артикул карточки WB без видеообложки." },
  { name = "Дата", type = "date", default = "today", note = "Когда сделали, дд.мм.гггг." },
  { name = "Продавец", type = "text", note = "Магазин или бренд." },
  { name = "Контакт", type = "text", note = "Куда отправили: сайт, Telegram, соцсеть." },
  { name = "Статус", type = "list:cover_status", default = "сделана", note = "Выбрать из списка." },
  { name = "ID клиента", type = "ref:Клиенты", note = "Если продавец стал клиентом." },
  { name = "Файл", type = "url", note = "Обложка на Диске." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Реклама"
key = "Код размещения"
id_prefix = "R"
id_aliases = ["Р", "P"]
columns = [
  { name = "Код размещения", type = "id", note = "R-0001… Латиницей: код стоит в ссылке поста (t.me/<бот>?start=R-0001 или t.me/<ник>?text=…R-0001) и в «Код источника» клиента." },
  { name = "Дата", type = "date", default = "today", note = "Дата выхода, дд.мм.гггг." },
  { name = "Площадка", type = "list:ad_platform", required = true, note = "Выбрать из списка." },
  { name = "Канал или кампания", type = "text", required = true, note = "@канал или название кампании." },
  { name = "Ссылка", type = "url", note = "Пост или кампания." },
  { name = "Расход, ₽", type = "money", note = "Сколько заплатили." },
  { name = "ERID", type = "text", note = "Маркировка размещения. Без ERID не публикуем." },
  { name = "Просмотры", type = "int", note = "По статистике канала." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

# Расходы, которых нет в других листах (план 3.4): генерации и подписки. Реклама — в «Рекламе», партнёрам — в «Выплатах».
[[sheets]]
name = "Расходы"
columns = [
  { name = "Дата", type = "date", required = true, default = "today", note = "Когда заплатили, дд.мм.гггг." },
  { name = "Статья", type = "list:expense_kind", required = true, note = "нейросети — Claude, Kling, Nano Banana, Higgsfield и т. п. (по ним — стоимость единицы); другие сервисы — MPStats, Продамус, Figma; прочее. Рекламу и выплаты партнёрам сюда не вносить." },
  { name = "Сервис", type = "text", required = true, note = "Чему заплатили: Claude Max, Kling, MPStats…" },
  { name = "Сумма, ₽", type = "money", required = true, note = "Сколько списали, в рублях (валюту пересчитайте по курсу списания)." },
  { name = "Комментарий", type = "text", note = "Свободный текст." },
]

[[sheets]]
name = "Журнал"
system = true
columns = [
  { name = "Время", type = "text", note = "Пишет только crm.py." },
  { name = "Кто", type = "text", note = "Какой компьютер или агент." },
  { name = "Команда", type = "text", note = "" },
  { name = "Лист", type = "text", note = "" },
  { name = "Ключ", type = "text", note = "" },
  { name = "Поле", type = "text", note = "" },
  { name = "Было", type = "text", note = "" },
  { name = "Стало", type = "text", note = "" },
]

